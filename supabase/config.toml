# Supabase CLI settings (used by `supabase start` for local development and `supabase link` / `db push`).
# Production auth settings (Site URL, redirect URLs, Google, SMS) are set in the Supabase dashboard – see SUPABASE_SETUP.md.
project_id = "examfleet"

[api]
enabled = true
port = 54321
schemas = ["public"]

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[inbucket]
# Local email inbox for magic links / OTP codes: http://localhost:54324
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false
otp_length = 6
otp_expiry = 3600

[auth.sms]
enable_signup = false

[auth.external.google]
enabled = false
client_id = "env(SUPABASE_AUTH_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GOOGLE_SECRET)"
skip_nonce_check = true
